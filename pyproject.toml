[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "httpnet"
version = "0.9.0"
description = "http.net Partner API client"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Erich Seifert", email = "dev@erichseifert.de" },
]
keywords = ["domain", "dns", "administration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.8.0",
    "requests>=2.22.0",
]

[project.urls]
Homepage = "https://github.com/eseifert/httpnet"
Repository = "https://github.com/eseifert/httpnet"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    "ty>=0.0.1a21",
]

[tool.hatch.build.targets.wheel]
packages = ["httpnet"]

[tool.hatch.build.targets.sdist]
include = [
    "/httpnet",
    "/tests",
    "/README.rst",
    "/LICENSE.txt",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]

ignore = [
    "C408",  # `dict(...)` calls are used deliberately to build API parameters
]

[tool.ruff.lint.isort]
known-first-party = ["httpnet"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["httpnet", "tests"]
