# Read the Docs configuration, cf. https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - pip install --upgrade uv
      - uv sync --no-default-groups --group docs --locked
    build:
      html:
        - uv run sphinx-build --builder html --fail-on-warning docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py

formats:
  - pdf
  - epub
